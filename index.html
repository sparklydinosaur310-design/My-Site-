 <!DOCTYPE html>              <!-- says "this is a modern HTML page" -->
  <html lang="en">             <!-- the whole page; lang="en" = English -->
  <head>                       <!-- stuff that sets up the page, not shown -->
      <meta charset="UTF-8">   <!-- handles special characters like é -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
                               <!-- makes it work on phones too -->
      <title>My Personal Website</title>   <!-- text shown in the browser tab -->
  </head>
  <body>                       <!-- EVERYTHING VISIBLE on the page goes here -->
      <h1>Welcome to my site!</h1>   <!-- h1 = biggest heading -->
  </body>
